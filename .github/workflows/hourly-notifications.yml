name: Northfield Hourly Notifications

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  send-hourly-summary:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Northfield hourly summary
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$APP_URL"
          test -n "$CRON_SECRET"
          curl --fail --silent --show-error \
            --retry 2 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "${APP_URL%/}/api/cron/hourly-notifications"
